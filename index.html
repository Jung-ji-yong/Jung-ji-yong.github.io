const cards = document.querySelectorAll('.year-card');
const gallery = document.getElementById('gallery');
const sectionYear = document.getElementById('section-year');
const lightbox = document.getElementById('lightbox');
const lbImage = document.getElementById('lightbox-image');
const lbTitle = document.getElementById('lightbox-title');
const lbMeta = document.getElementById('lightbox-meta');
let current = [];
let currentIndex = 0;

function showYear(year, scroll=true) {
  current = works.filter(w => w.year === year);
  sectionYear.textContent = year;
  gallery.innerHTML = current.map((w, i) => `
    <button class="work" data-index="${i}">
      <img src="${w.image}" alt="${w.title}">
      <span>${w.title}</span>
    </button>
  `).join('');
  gallery.querySelectorAll('.work').forEach(btn => {
    btn.addEventListener('click', () => openLightbox(Number(btn.dataset.index)));
  });
  if (scroll) document.getElementById('works').scrollIntoView({behavior:'smooth', block:'start'});
}

function openLightbox(index) {
  currentIndex = index;
  const w = current[currentIndex];
  lbImage.src = w.image;
  lbImage.alt = w.title;
  lbTitle.textContent = w.title;
  lbMeta.textContent = [w.year, w.material, w.size].filter(Boolean).join(' · ');
  lightbox.classList.add('open');
  lightbox.setAttribute('aria-hidden','false');
  document.body.classList.add('locked');
}

function closeLightbox() {
  lightbox.classList.remove('open');
  lightbox.setAttribute('aria-hidden','true');
  document.body.classList.remove('locked');
}

function move(delta) {
  currentIndex = (currentIndex + delta + current.length) % current.length;
  openLightbox(currentIndex);
}

cards.forEach(card => {
  const year = card.dataset.year;
  card.querySelector('.year-image').addEventListener('click', () => showYear(year));
  card.addEventListener('click', e => {
    if (!e.target.closest('.year-image')) showYear(year);
  });
});

document.getElementById('close').onclick = closeLightbox;
document.getElementById('prev').onclick = () => move(-1);
document.getElementById('next').onclick = () => move(1);
lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
document.addEventListener('keydown', e => {
  if (!lightbox.classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') move(-1);
  if (e.key === 'ArrowRight') move(1);
});

showYear('2024', false);
</script>
